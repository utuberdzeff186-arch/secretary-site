<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена | Секретарь</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #080a0f; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; background-image: radial-gradient(circle at 50% 50%, rgba(231, 76, 60, 0.1), transparent 50%); }
        h1 { font-size: 120px; margin: 0; color: #e74c3c; text-shadow: 0 0 30px rgba(231, 76, 60, 0.5); }
        h2 { font-size: 24px; color: #fff; margin-bottom: 20px; }
        p { color: #a0a0a0; max-width: 400px; margin-bottom: 30px; }
        a { padding: 15px 30px; background: #4da8da; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        a:hover { background: #3a8bb8; transform: translateY(-3px); }
    </style>
</head>
<body>
    <div style="font-size: 80px; margin-bottom: 20px; animation: float 3s infinite;">🛡️</div>
    <h1>404</h1>
    <h2>Доступ запрещен или страница не найдена</h2>
    <p>Похоже, вы пытаетесь попасть в зону, которой не существует. Наши системы безопасности зафиксировали этот запрос.</p>
    <a href="index.html">← Вернуться на главную</a>
    <style>@keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0); } }</style>
</body>
</html>
